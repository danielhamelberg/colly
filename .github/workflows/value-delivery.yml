name: Colly value delivery
on:
  push:
    branches: ['danielhamelberg/colly-brik-value-20260929']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: colly-value-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit, artifact-boundary and handoff regressions
        run: python -m unittest discover -v
      - name: Documentation checks
        run: python scripts/check_docs.py
      - name: Frozen contract and retained artifact evidence
        run: python -m harness.agent_tool_eval --provider offline-contract --ledger artifacts/value/ledger.jsonl
      - name: Independent adjudication
        run: python -m harness.agent_tool_adjudicate --ledger artifacts/value/ledger.jsonl --acceptance artifacts/value/acceptance.json
      - name: Deterministic handoff smoke (not model-performance evidence)
        run: python scripts/run_value_smoke.py --output artifacts/value/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colly-value-${{ matrix.os }}
          path: artifacts/value/
